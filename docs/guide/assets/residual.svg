<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" role="img">
<title>선 잔차 · 유한 구간의 겹침과 수직 거리 (설명도)</title>
<rect width="100%" height="100%" fill="white"/>
<text x="20" y="31" font-family="Malgun Gothic, sans-serif" font-size="20" text-anchor="start" fill="#17324d">선 잔차 · 유한 구간의 겹침과 수직 거리 (설명도)</text>
<line x1="58" y1="150" x2="550" y2="150" stroke="#087f73" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="153" y1="150" x2="378" y2="150" stroke="#087f73" stroke-width="5" stroke-dasharray="none"/>
<line x1="93" y1="110" x2="468" y2="84" stroke="#2171b5" stroke-width="4" stroke-dasharray="none"/>
<circle cx="93" cy="110" r="4" fill="#2171b5"/>
<line x1="93" y1="110" x2="93" y2="150" stroke="#b44734" stroke-width="2" stroke-dasharray="3 3"/>
<text x="99" y="130.0" font-family="Malgun Gothic, sans-serif" font-size="16" text-anchor="start" fill="#b44734">r₀</text>
<circle cx="468" cy="84" r="4" fill="#2171b5"/>
<line x1="468" y1="84" x2="468" y2="150" stroke="#b44734" stroke-width="2" stroke-dasharray="3 3"/>
<text x="474" y="117.0" font-family="Malgun Gothic, sans-serif" font-size="16" text-anchor="start" fill="#b44734">r₁</text>
<text x="224" y="87" font-family="Malgun Gothic, sans-serif" font-size="16" text-anchor="start" fill="#2171b5">예측한 모델 에지</text>
<text x="181" y="178" font-family="Malgun Gothic, sans-serif" font-size="16" text-anchor="start" fill="#087f73">검출 선분 · 양 끝이 잘릴 수 있음</text>
<text x="58" y="216" font-family="Malgun Gothic, sans-serif" font-size="14" text-anchor="start" fill="#17324d">수직 오차가 작아도 두 유한 구간이 겹치지 않으면 다른 모서리일 수 있다.</text>
</svg>
